<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股深度研究報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --bg-card: #ffffff;
  --ink: #0f1419;
  --ink-secondary: #4a5056;
  --ink-muted: #8a8f94;
  --rule: #d8d4cd;
  --accent: #b8351a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Serif TC', Georgia, serif;
  font-weight: 400;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.container {
  max-width: 880px;
  margin: 0 auto;
  padding: 80px 40px 120px;
}

header {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 32px;
  margin-bottom: 48px;
}

.eyebrow {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}

h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.15;
  letter-spacing: -0.01em;
}

.subtitle {
  margin-top: 16px;
  color: var(--ink-secondary);
  font-size: 17px;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
}

.section-title {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 24px;
}

.report-list {
  list-style: none;
  display: grid;
  gap: 0;
}

.report-item {
  border-top: 1px solid var(--rule);
  transition: background 0.2s ease;
}

.report-item:last-child {
  border-bottom: 1px solid var(--rule);
}

.report-item a {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 24px;
  align-items: center;
  padding: 24px 8px;
  color: var(--ink);
  text-decoration: none;
  transition: padding 0.2s ease;
}

.report-item a:hover {
  background: rgba(184, 53, 26, 0.04);
  padding-left: 16px;
}

.ticker {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
}

.report-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.report-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}

.report-desc {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  color: var(--ink-muted);
}

.report-date {
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: 13px;
  color: var(--ink-muted);
  letter-spacing: 0.05em;
}

footer {
  margin-top: 80px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.6;
}

footer a {
  color: var(--ink-secondary);
  text-decoration: underline;
  text-decoration-color: var(--rule);
}

@media (max-width: 600px) {
  .container { padding: 48px 24px 80px; }
  .report-item a {
    grid-template-columns: 60px 1fr;
    gap: 16px;
  }
  .report-date {
    grid-column: 2;
    margin-top: -4px;
  }
  .ticker { font-size: 22px; }
  .report-name { font-size: 17px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="eyebrow">Equity Research</div>
    <h1>個股深度研究報告</h1>
    <p class="subtitle">Taiwan Stock Market — Independent Research Notes</p>
  </header>

  <section>
    <div class="section-title">Reports</div>
    <ul class="report-list">
      <li class="report-item">
        <a href="Atlassian_TEAM_Report_20260508.html">
          <div class="ticker">TEAM</div>
          <div class="report-meta">
            <div class="report-name">Atlassian</div>
            <div class="report-desc">Atlassian Corporation — 深度研究報告</div>
          </div>
          <div class="report-date">2026.05.08</div>
        </a>
      </li>
      <li class="report-item">
        <a href="2645_Report_20260423.html">
          <div class="ticker">2645</div>
          <div class="report-meta">
            <div class="report-name">長榮航太</div>
            <div class="report-desc">Evergreen Aviation Technologies — 深度研究報告</div>
          </div>
          <div class="report-date">2026.04.23</div>
        </a>
      </li>
    </ul>
  </section>

  <footer>
    本站內容僅為個人研究筆記，不構成任何投資建議。<br>
    Source on <a href="https://github.com/R0ywu/stock-research">GitHub</a>.
  </footer>
</div>
</body>
</html>
